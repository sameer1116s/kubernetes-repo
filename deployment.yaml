apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: sameer11s/my-app:e6053d2223a4dac230b4a5848bef78b3d724c111
          ports:
            - containerPort: 80
