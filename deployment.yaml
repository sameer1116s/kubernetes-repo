apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: sameer11s/my-app:5ef00603f8a39505901858d1f044b2edc846a0c5
          ports:
            - containerPort: 80
